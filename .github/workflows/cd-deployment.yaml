name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ${{ github.repository }}-api
  APP_IMAGE: ${{ github.repository }}-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:${{ github.sha }}

      - name: Build and push demo image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.app
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.APP_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.APP_IMAGE }}:${{ github.sha }}

      # --- MLOPS LEVEL 2: CD CONTINUOUS DELIVERY ---
      # 1. CD de Inferencia: Despliegue automático a Google Cloud Run
      # Requiere configurar GCP_CREDENTIALS en los secrets de GitHub
      - name: Deploy API to Google Cloud Run
        if: github.ref == 'refs/heads/main'
        uses: google-github-actions/deploy-cloudrun@v2
        continue-on-error: true  # Permite que pase en forks sin credenciales
        with:
          service: credit-risk-api
          image: ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:${{ github.sha }}
          region: us-central1

      # 2. CD del Pipeline: Despliegue automático del orquestador a Prefect Cloud
      # Requiere configurar PREFECT_API_KEY en los secrets de GitHub
      - name: Deploy Pipeline to Prefect Cloud
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          prefect cloud login --key ${{ secrets.PREFECT_API_KEY }} --workspace tu-usuario/credit-risk || true
          prefect deploy src/orchestrator/pipeline.py:retraining_pipeline -n "prod-retraining" -p default-pool || true
