name: CD

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest
      - run: docker build -t credit-risk-api:${{ github.sha }} -f docker/Dockerfile.api .
      - name: Deploy API
        run: echo "Configure the production registry and deployment target here"