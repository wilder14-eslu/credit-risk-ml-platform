name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint y formato (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.6"
      - run: ruff check . --output-format=github
      - run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar dependencias
        run: pip install -e ".[ml,gateway,dev]"
      - name: Pytest + cobertura
        run: pytest -p no:warnings --cov --cov-report=term --cov-report=xml --cov-fail-under=80 --junitxml=junit.xml
      - name: Resumen de cobertura
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          print(f"### Cobertura: {float(root.get('line-rate')) * 100:.1f}%")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml

  bundle:
    name: Validar Databricks Asset Bundle
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validación de sintaxis y esquema (sin credenciales)
        run: |
          databricks bundle schema > /tmp/schema.json
          python -c "import yaml,sys; [yaml.safe_load(open(f)) for f in ('databricks.yml','resources/jobs.yml')]; print('YAML OK')"
      - name: Validación contra el workspace (dev)
        if: env.DATABRICKS_HOST != ''
        run: databricks bundle validate -t dev

  gateway-smoke:
    name: Smoke test del gateway (uvicorn)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: gateway/requirements.txt
      - run: pip install -r gateway/requirements.txt && pip install --no-deps -e .
      - name: Levantar gateway con modelo local y probar /predict
        env:
          SERVING_BACKEND: local
          LOG_SINK: memory
          API_KEYS: ci-key
        run: |
          uvicorn gateway.main:app --port 8000 &
          for i in $(seq 1 60); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf -X POST localhost:8000/api/v1/predict \
            -H "X-API-Key: ci-key" -H "Content-Type: application/json" \
            -d '{"applicant_id":"CI-1","features":{"revolving_utilization_unsecured":0.4,"age":35,"debt_ratio":0.3,"monthly_income":4000,"number_open_credit_lines":6,"number_dependents":1}}' \
            | tee response.json
          python -c "import json; r=json.load(open('response.json')); assert 0 <= r['probability'] <= 1; print('OK', r['decision'])"
