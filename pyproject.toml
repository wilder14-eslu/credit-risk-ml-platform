[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Conjunto explícito para que el resultado sea el mismo en local y en CI,
# sin depender de los valores por defecto de la versión de ruff instalada.
select = ["E4", "E7", "E9", "F", "I", "ISC", "RUF"]
# Códigos citados en `# noqa` a propósito aunque no estén activados.
external = ["UP017", "BLE001"]

[tool.pytest.ini_options]
pythonpath = ["."]
