# Render Blueprint: gateway FastAPI + panel Streamlit.
# El modelo NO corre aquí: el gateway consulta Databricks Model Serving.
services:
  - type: web
    name: credit-risk-gateway
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r gateway/requirements.txt && pip install --no-deps -e .
    startCommand: uvicorn gateway.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false   # lo dispara el pipeline de CD cuando CI pasa
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SERVING_BACKEND
        value: databricks
      - key: LOG_SINK
        value: databricks
      - key: SERVING_ENDPOINT
        value: credit-risk-endpoint
      - key: UC_CATALOG
        value: workspace
      - key: UC_SCHEMA
        value: credit_risk
      - key: DATABRICKS_HOST
        sync: false
      - key: DATABRICKS_TOKEN
        sync: false
      - key: DATABRICKS_WAREHOUSE_ID
        sync: false
      - key: API_KEYS
        generateValue: true

  - type: web
    name: credit-risk-dashboard
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r app/requirements.txt
    startCommand: streamlit run app/streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: API_URL
        fromService:
          type: web
          name: credit-risk-gateway
          property: host
      - key: API_KEY
        fromService:
          type: web
          name: credit-risk-gateway
          envVarKey: API_KEYS
